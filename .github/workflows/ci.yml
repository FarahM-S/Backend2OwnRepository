name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_USERNAME: ${{secrets.DATABASEUSERNAME}}
          MYSQL_ROOT_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
          MYSQL_DATABASE: customerdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost "
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn -B test

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build projekt
        run: mvn -B package -DskipTests

      - name: Log into Docker Hub
        if: github.event_name == 'push'
        run: echo ${{secrets.DOCKERHUB_TOKEN}} | docker login -u ${{secrets.DOCKERHUB_USERNAME}} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
          -t farahmsleiman/booking-service-java25:${{ github.run_number }} \
          .

      - name: push docker hub
        if: github.event_name == 'push'
        run: |
          docker push farahmsleiman/booking-service-java25:${{github.run_number}}
        env:
          SPRING_DATASOURCE_URL: ${{secrets.DATABASE_URL}}
          SPRING_DATASOURCE_USERNAME: ${{secrets.DATABASE_USERNAME}}
          SPRING_DATASOURCE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}

